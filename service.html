<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Our works | The Unconventionalists</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="works-header">
    <a class="blur-focus" href="index.html" aria-label="Back to home">
      <img class="wordmark" src="wordmark.svg" alt="unconventionalists">
    </a>
  </header>

  <nav class="works-nav">
    <a class="blur-focus" href="index.html#who">who are we.</a>
    <a class="blur-focus" href="works.html">our works.</a>
    <a class="blur-focus" href="index.html#contact">contact</a>
  </nav>

  <!-- One template for all five services: service.html?s=brand-design etc. -->
  <main class="svc">
    <!-- Two vertical lines, each broken in the middle as in Figma -->
    <span class="line line--v svc__vl svc__vl--a svc__vl--top" aria-hidden="true"></span>
    <span class="line line--v svc__vl svc__vl--a svc__vl--bottom" aria-hidden="true"></span>
    <span class="line line--v svc__vl svc__vl--b svc__vl--top" aria-hidden="true"></span>
    <span class="line line--v svc__vl svc__vl--b svc__vl--bottom" aria-hidden="true"></span>
    <div class="svc__spacer"></div>
    <div class="svc__top">
      <h1 class="svc__title blur-focus" tabindex="0"></h1>
      <p class="svc__desc blur-focus" tabindex="0"></p>
    </div>
    <ul class="svc__cards"></ul>
  </main>

  <script src="works-data.js"></script>
  <script>
    const slug = new URLSearchParams(location.search).get('s');
    const service = SERVICES.find((s) => s.slug === slug) || SERVICES[0];
    document.title = `${service.name} | The Unconventionalists`;
    document.querySelector('.svc__title').textContent = service.name;
    document.querySelector('.svc__desc').textContent = service.desc;
    document.querySelector('.svc__cards').innerHTML = service.projects.map((id) => {
      const p = PROJECTS[id];
      const img = p.cover ? `<img src="${p.cover}" alt="">` : '';
      return `<li><a class="work-card" href="project.html?p=${id}&s=${service.slug}">
        <span class="work-card__img">${img}</span>
        <span class="work-card__name">${p.name}</span>
      </a></li>`;
    }).join('');
  </script>
  <script src="script.js"></script>
</body>
</html>
